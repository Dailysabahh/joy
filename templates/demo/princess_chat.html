<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Princess — XtraBrides of Lagos AI Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #faf5f8;
      --surface: #ffffff;
      --surface2: #fef3f9;
      --border: #fce7f3;
      --accent: #d946a6;
      --accent-dark: #be3987;
      --text: #1f1f1f;
      --text-muted: #888;
      --bubble-user: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --bubble-user-text: #ffffff;
      --bubble-bot: #ffffff;
      --bubble-bot-text: #1f1f1f;
      --bubble-bot-border: #fce7f3;
      --radius: 18px;
      --radius-sm: 8px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    /* ── Layout ── */
    .app { display: flex; flex-direction: column; height: 100dvh; max-width: 480px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); background: var(--bg); }

    /* ── Header ── */
    .header {
      display: flex; align-items: center; gap: 12px;
      padding: 16px;
      background: linear-gradient(135deg, #d946a6 0%, #ff6ec7 100%);
      border-bottom: 2px solid #ffb8e0;
      flex-shrink: 0;
    }
    .avatar {
      width: 50px; height: 50px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; flex-shrink: 0;
      border: 2px solid rgba(255, 255, 255, 0.4);
    }
    .header-info { flex: 1; min-width: 0; }
    .bot-name { font-weight: 700; font-size: 18px; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bot-status { font-size: 13px; color: rgba(255, 255, 255, 0.9); margin-top: 2px; }
    .powered-by { font-size: 11px; color: rgba(255, 255, 255, 0.85); white-space: nowrap; }
    .powered-by a { color: white; text-decoration: none; font-weight: 600; }

    /* ── Messages area ── */
    .messages {
      flex: 1; overflow-y: auto; padding: 20px 16px;
      display: flex; flex-direction: column; gap: 12px;
      scroll-behavior: smooth;
      background: var(--bg);
    }
    .messages::-webkit-scrollbar { width: 5px; }
    .messages::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; opacity: 0.5; }

    /* ── Bubbles ── */
    .bubble-row { display: flex; align-items: flex-end; gap: 8px; }
    .bubble-row.user { justify-content: flex-end; }
    .bubble-row.bot { justify-content: flex-start; }

    .bubble {
      max-width: 75%; padding: 12px 16px;
      font-size: 14.5px; line-height: 1.6;
      word-break: break-word; white-space: pre-wrap;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    .bubble.user {
      background: var(--bubble-user);
      color: var(--bubble-user-text);
      border-radius: var(--radius) var(--radius) var(--radius-sm) var(--radius);
      font-weight: 500;
    }
    .bubble.bot {
      background: var(--bubble-bot);
      color: var(--bubble-bot-text);
      border: 1px solid var(--bubble-bot-border);
      border-radius: var(--radius) var(--radius) var(--radius) var(--radius-sm);
    }
    .bubble time {
      display: block;
      font-size: 10px;
      margin-top: 6px;
      opacity: 0.6;
      text-align: right;
    }

    /* ── Typing indicator ── */
    .typing { display: none; }
    .typing.visible { display: flex; }
    .typing .bubble { padding: 14px 18px; }
    .dots { display: flex; gap: 4px; align-items: center; height: 18px; }
    .dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.7; } 30% { transform: translateY(-8px); opacity: 1; } }

    /* ── Input area ── */
    .input-area {
      display: flex; align-items: flex-end; gap: 10px;
      padding: 14px 16px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    #msgInput {
      flex: 1;
      background: var(--surface2);
      border: 2px solid var(--border);
      color: var(--text);
      border-radius: 22px;
      padding: 12px 18px;
      font-size: 14.5px;
      outline: none;
      resize: none;
      max-height: 120px;
      overflow-y: auto;
      line-height: 1.5;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #msgInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(217, 70, 166, 0.1);
    }
    #msgInput::placeholder { color: var(--text-muted); }
    .send-btn {
      width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, #d946a6 0%, #ff6ec7 100%);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: white;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(217, 70, 166, 0.3);
    }
    .send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(217, 70, 166, 0.4);
    }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .send-btn svg { width: 22px; height: 22px; }

    /* ── XBL banner ── */
    .xbl-banner {
      text-align: center; padding: 10px 16px;
      background: linear-gradient(135deg, rgba(217, 70, 166, 0.08) 0%, rgba(255, 110, 199, 0.08) 100%);
      border-bottom: 1px solid rgba(217, 70, 166, 0.15);
      font-size: 12px; color: var(--text-muted); flex-shrink: 0;
    }
    .xbl-banner strong { color: var(--accent); font-weight: 600; }
    .xbl-banner a { color: var(--accent); text-decoration: none; font-weight: 600; }

    @media (max-width: 480px) { .app { border: none; } }
  </style>
</head>
<body>
<div class="app">

  <!-- ── Active chat ── -->
  <div class="xbl-banner">
    ✨ <strong>XtraBrides of Lagos</strong> — Prestige & Timeless Couture
  </div>

  <div class="header">
    <div class="avatar">{{ avatar }}</div>
    <div class="header-info">
      <div class="bot-name">{{ bot_name }}</div>
      <div class="bot-status">● Online — Your Personal Bridal Assistant</div>
    </div>
    <div class="powered-by">by <a href="https://closertech.ai" target="_blank">Closer Tech</a></div>
  </div>

  <div class="messages" id="messages">
    <!-- Greeting bubble injected by JS -->
  </div>

  <div class="bubble-row bot typing" id="typing">
    <div class="bubble bot">
      <div class="dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <div class="input-area">
    <textarea id="msgInput" rows="1" placeholder="Ask about collections, pricing, or book a consultation…" autocomplete="off"></textarea>
    <button class="send-btn" id="sendBtn" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

</div>

<script>
  const BOT_NAME = "{{ bot_name }}";
  const GREETING = {{ greeting | tojson }};

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("msgInput");
  const sendBtn = document.getElementById("sendBtn");
  const typingEl = document.getElementById("typing");

  let history = [];

  function now() {
    return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function addBubble(role, text) {
    const row = document.createElement("div");
    row.className = `bubble-row ${role}`;
    const bubble = document.createElement("div");
    bubble.className = `bubble ${role}`;
    bubble.textContent = text;
    const time = document.createElement("time");
    time.textContent = now();
    bubble.appendChild(time);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setTyping(show) {
    typingEl.classList.toggle("visible", show);
    if (show) messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function sendMessage(text) {
    if (!text.trim()) return;
    addBubble("user", text);
    history.push({ role: "user", content: text });
    inputEl.value = "";
    inputEl.style.height = "";
    sendBtn.disabled = true;
    setTyping(true);

    try {
      const res = await fetch(`/princess/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history }),
      });
      const data = await res.json();
      const reply = data.reply || "I'm sorry, something went wrong. Please try again.";
      history.push({ role: "assistant", content: reply });
      addBubble("bot", reply);
    } catch {
      addBubble("bot", "I apologize for the brief issue. Please contact us at +234 810 618 0911.");
    } finally {
      setTyping(false);
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", () => sendMessage(inputEl.value));

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage(inputEl.value);
    }
  });

  // Auto-resize textarea
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  });

  // Show greeting on load
  window.addEventListener("load", () => {
    setTimeout(() => {
      addBubble("bot", GREETING);
      history.push({ role: "assistant", content: GREETING });
    }, 400);
  });
</script>
</body>
</html>
