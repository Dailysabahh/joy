<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live call — Gemini</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f1115;
            color: #f4f1ea;
        }
        .card {
            width: min(720px, 100%);
            background: #171a21;
            border: 1px solid #2a2f3a;
            border-radius: 24px;
            padding: 32px;
        }
        h1 { margin: 0 0 8px; font-size: 1.8rem; }
        p.lead { margin: 0 0 24px; color: #b7b1a6; }
        .status {
            padding: 14px 16px;
            border-radius: 12px;
            background: #222733;
            margin-bottom: 24px;
        }
        .status.error { background: #3a1d22; color: #ffb4b4; }
        button.mic {
            width: 108px;
            height: 108px;
            border: 0;
            border-radius: 50%;
            font-size: 2.4rem;
            cursor: pointer;
            background: #efe7d6;
            color: #17120b;
        }
        button.mic.live {
            background: #d4554a;
            color: white;
            animation: pulse 1.4s infinite;
        }
        @keyframes pulse {
            50% { transform: scale(1.06); }
        }
        .controls { text-align: center; margin-bottom: 20px; }
        .hint { color: #b7b1a6; margin-top: 12px; }
        .transcript {
            min-height: 260px;
            max-height: 380px;
            overflow: auto;
            background: #101318;
            border-radius: 16px;
            padding: 16px;
        }
        .line { margin: 0 0 12px; line-height: 1.45; }
        .line strong { display: block; font-size: 0.78rem; letter-spacing: 0.04em; color: #b7b1a6; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Live call</h1>
        <p class="lead">Gemini Live, Kore voice. Both sides stay open. Talk over her and she stops.</p>
        <div id="status" class="status">Click the microphone to start.</div>
        <div class="controls">
            <button id="mic" class="mic" onclick="toggleCall()">🎙️</button>
            <div class="hint" id="hint">Microphone is off</div>
        </div>
        <div id="transcript" class="transcript"></div>
    </div>
    <script>
        const INPUT_RATE = 16000;
        const OUTPUT_RATE = 24000;
        let ws = null;
        let audioContext = null;
        let processor = null;
        let player = null;
        let mediaStream = null;
        let live = false;
        let ring = null;
        let ringRead = 0;
        let ringWrite = 0;
        let ringSamples = 0;
        let primed = false;
        let silentPulls = 0;
        let speaking = false;
        let bargeFrames = 0;
        let joyLine = null;
        const BARGE_RMS = 0.07;

        function setStatus(text, isError) {
            const box = document.getElementById("status");
            box.textContent = text;
            box.className = isError ? "status error" : "status";
        }

        function addLine(who, text) {
            const box = document.getElementById("transcript");
            const line = document.createElement("p");
            line.className = "line";
            const label = document.createElement("strong");
            label.textContent = who;
            const body = document.createElement("span");
            body.textContent = text;
            line.appendChild(label);
            line.appendChild(body);
            box.appendChild(line);
            box.scrollTop = box.scrollHeight;
            return body;
        }

        function resample(input, inRate, outRate) {
            if (inRate === outRate) return input;
            const ratio = inRate / outRate;
            const length = Math.floor(input.length / ratio);
            const output = new Float32Array(length);
            for (let i = 0; i < length; i++) {
                const position = i * ratio;
                const left = Math.floor(position);
                const right = Math.min(left + 1, input.length - 1);
                const mix = position - left;
                output[i] = input[left] * (1 - mix) + input[right] * mix;
            }
            return output;
        }

        function floatToPcm16(samples) {
            const buffer = new ArrayBuffer(samples.length * 2);
            const view = new DataView(buffer);
            for (let i = 0; i < samples.length; i++) {
                const value = Math.max(-1, Math.min(1, samples[i]));
                view.setInt16(i * 2, value < 0 ? value * 0x8000 : value * 0x7fff, true);
            }
            return buffer;
        }

        function writeRing(samples) {
            for (let i = 0; i < samples.length; i++) {
                ring[ringWrite] = samples[i];
                ringWrite = (ringWrite + 1) % ring.length;
                if (ringSamples < ring.length) ringSamples += 1;
                else ringRead = (ringRead + 1) % ring.length;
            }
            if (!primed && ringSamples >= Math.floor(audioContext.sampleRate * 0.06)) primed = true;
        }

        function stopPlayback() {
            primed = false;
            speaking = false;
            silentPulls = 0;
            bargeFrames = 0;
            ringRead = 0;
            ringWrite = 0;
            ringSamples = 0;
            if (ring) ring.fill(0);
        }

        function playPcm16(arrayBuffer) {
            if (!audioContext || !ring) return;
            speaking = true;
            if (audioContext.state === "suspended") audioContext.resume();
            const view = new DataView(arrayBuffer);
            const input = new Float32Array(Math.floor(arrayBuffer.byteLength / 2));
            for (let i = 0; i < input.length; i++) input[i] = view.getInt16(i * 2, true) / 32768;
            const samples = resample(input, OUTPUT_RATE, audioContext.sampleRate);
            if (samples.length) writeRing(samples);
        }

        function startPlayer() {
            ring = new Float32Array(audioContext.sampleRate * 20);
            player = audioContext.createScriptProcessor(1024, 1, 1);
            player.onaudioprocess = (event) => {
                const output = event.outputBuffer.getChannelData(0);
                if (!primed) {
                    output.fill(0);
                    return;
                }
                let playedAny = false;
                for (let i = 0; i < output.length; i++) {
                    if (ringSamples <= 0) {
                        output[i] = 0;
                        continue;
                    }
                    output[i] = ring[ringRead];
                    ringRead = (ringRead + 1) % ring.length;
                    ringSamples -= 1;
                    playedAny = true;
                }
                if (playedAny) {
                    silentPulls = 0;
                    return;
                }
                silentPulls += 1;
                if (silentPulls < 6) return;
                primed = false;
                speaking = false;
                silentPulls = 0;
                setStatus("Your turn.");
            };
            player.connect(audioContext.destination);
        }

        async function toggleCall() {
            if (live) stopCall();
            else await startCall();
        }

        async function startCall() {
            const button = document.getElementById("mic");
            setStatus("Connecting to Gemini…");
            ws = new WebSocket(`ws://${location.host}/voice/gemini/live`);
            ws.binaryType = "arraybuffer";
            ws.onmessage = async (event) => {
                if (event.data instanceof ArrayBuffer) {
                    playPcm16(event.data);
                    return;
                }
                const data = JSON.parse(event.data);
                if (data.type === "status" && data.status === "ready" && !live) {
                    try {
                        mediaStream = await navigator.mediaDevices.getUserMedia({
                            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                        });
                        audioContext = new AudioContext();
                        await audioContext.resume();
                        const source = audioContext.createMediaStreamSource(mediaStream);
                        processor = audioContext.createScriptProcessor(2048, 1, 1);
                        processor.onaudioprocess = (audioEvent) => {
                            if (!ws || ws.readyState !== WebSocket.OPEN) return;
                            const input = audioEvent.inputBuffer.getChannelData(0);
                            let energy = 0;
                            for (let i = 0; i < input.length; i++) energy += input[i] * input[i];
                            const rms = Math.sqrt(energy / input.length);
                            if (speaking) {
                                if (rms < BARGE_RMS) {
                                    bargeFrames = 0;
                                    return;
                                }
                                bargeFrames += 1;
                                if (bargeFrames < 2) return;
                                stopPlayback();
                            }
                            const audio = resample(input, audioContext.sampleRate, INPUT_RATE);
                            ws.send(floatToPcm16(audio));
                        };
                        const mute = audioContext.createGain();
                        mute.gain.value = 0;
                        source.connect(processor);
                        processor.connect(mute);
                        mute.connect(audioContext.destination);
                        startPlayer();
                        live = true;
                        button.classList.add("live");
                        button.textContent = "⏹️";
                        document.getElementById("hint").textContent = "Live. Speak, or talk over her.";
                        setStatus("Live with Kore. She hears you as you speak.");
                        ws.send(JSON.stringify({ type: "ready" }));
                    } catch (error) {
                        setStatus("Microphone blocked: " + error.message, true);
                        ws.close();
                    }
                } else if (data.type === "transcript_delta") {
                    if (!joyLine) joyLine = addLine("Joy", "");
                    joyLine.textContent += data.text;
                } else if (data.type === "transcript" && data.role === "user") {
                    joyLine = null;
                    addLine("You", data.text);
                } else if (data.type === "turn_done") {
                    joyLine = null;
                } else if (data.type === "interrupt") {
                    stopPlayback();
                    joyLine = null;
                } else if (data.type === "error") {
                    setStatus(data.message, true);
                }
            };
            ws.onerror = () => setStatus("Connection failed.", true);
            ws.onclose = () => { if (live) stopCall(); };
        }

        function stopCall() {
            live = false;
            stopPlayback();
            const button = document.getElementById("mic");
            button.classList.remove("live");
            button.textContent = "🎙️";
            document.getElementById("hint").textContent = "Microphone is off";
            setStatus("Call ended.");
            if (processor) processor.disconnect();
            processor = null;
            if (player) player.disconnect();
            player = null;
            ring = null;
            if (mediaStream) mediaStream.getTracks().forEach((track) => track.stop());
            mediaStream = null;
            if (audioContext) audioContext.close();
            audioContext = null;
            if (ws) ws.close();
            ws = null;
            joyLine = null;
        }
    </script>
</body>
</html>
