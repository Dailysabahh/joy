{% extends "app/base.html" %}
{% block title %}Chat with {{ agent.name }}{% endblock %}
{% block content %}
  <style>
    .thread { min-height: 420px; max-height: 62vh; overflow: auto; display: flex; flex-direction: column; gap: 12px; padding: 4px 2px 12px; }
    .bubble { max-width: min(640px, 86%); border: 1px solid #222; border-radius: 14px; padding: 12px 14px; line-height: 1.5; }
    .bubble.you { align-self: flex-end; background: #fff; color: #111; border-color: #fff; }
    .bubble.bot { align-self: flex-start; background: #0a0a0a; }
    .bubble small { display: block; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 4px; opacity: .6; }
    .composer { display: flex; gap: 8px; margin-top: 8px; }
    .composer input { flex: 1; }
    .composer button { width: auto; }
  </style>
  <div class="rowline">
    <div>
      <h1>Chat with {{ agent.name }}</h1>
      <p class="lead">{{ agent.business_name }}. Typed messages use the same facts as the call.</p>
    </div>
    <a class="ghost" href="/talk/{{ agent.token }}">Talk instead</a>
  </div>
  <section class="card">
    <div class="thread" id="thread">
      <div class="bubble bot"><small>{{ agent.name }}</small>{{ agent.greeting }}</div>
    </div>
    <form class="composer" id="composer">
      <input id="message" name="message" autocomplete="off" placeholder="Write a message" required />
      <button class="primary" type="submit" id="send">Send</button>
    </form>
  </section>
  <script>
    const thread = document.getElementById("thread");
    const form = document.getElementById("composer");
    const input = document.getElementById("message");
    const send = document.getElementById("send");
    let chatId = "";
    function add(who, text, you) {
      const bubble = document.createElement("div");
      bubble.className = "bubble " + (you ? "you" : "bot");
      const label = document.createElement("small");
      label.textContent = who;
      bubble.appendChild(label);
      bubble.appendChild(document.createTextNode(text));
      thread.appendChild(bubble);
      thread.scrollTop = thread.scrollHeight;
    }
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      add("You", text, true);
      send.disabled = true;
      try {
        const response = await fetch("/app/bots/{{ agent.token }}/message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, chat_id: chatId })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "The message did not send.");
        chatId = data.chat_id || chatId;
        add({{ agent.name | tojson }}, data.reply, false);
      } catch (error) {
        add({{ agent.name | tojson }}, error.message, false);
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
{% endblock %}
