<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Login — Closer Tech Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#09090b;--surface:#161618;--surface2:#1f1f22;--border:#27272a;--accent:#25d366;--red:#ef4444;--tx:#f4f4f5;--tx2:#a1a1aa;--r:10px}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:48px 40px;max-width:420px;width:100%}
.brand{font-size:22px;font-weight:800;color:var(--accent);text-align:center;margin-bottom:8px;letter-spacing:-.5px}
.subtitle{text-align:center;color:var(--tx2);font-size:13px;margin-bottom:36px}
label{display:block;font-size:12px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;font-size:14px;color:var(--tx);outline:none;transition:border-color .15s;margin-bottom:20px}
input:focus{border-color:var(--accent)}
button{width:100%;background:var(--accent);color:#000;border:none;border-radius:var(--r);padding:14px;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s}
button:hover{opacity:.9}
.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:var(--r);padding:12px 16px;font-size:13px;color:var(--red);margin-bottom:20px}
.help{text-align:center;margin-top:24px;font-size:13px;color:var(--tx2)}
.help a{color:var(--accent)}
</style>
</head>
<body>
<div class="card">
  <div class="brand">🤖 Closer Tech</div>
  <div class="subtitle">Customer Dashboard Login</div>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="POST" action="/portal">
    <label>Username</label>
    <input type="text" name="username" placeholder="Your username" required autocomplete="username"/>
    <label>Password</label>
    <input type="password" name="password" placeholder="Your password" required autocomplete="current-password"/>
    <button type="submit">Login →</button>
  </form>
  <div class="help">
    Don't have an account? <a href="/account/signup">Create one</a>
  </div>
</div>
</body>
</html>
