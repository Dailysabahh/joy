# ============================================================
#  Nginx configuration for Closer Tech / Joy
#  joy.aicloser.tech  → Joy WhatsApp AI bot (FastAPI)
#  aicloser.tech      → Closer Tech website (static HTML)
# ============================================================

# ── Redirect all HTTP → HTTPS ──────────────────────────────

server {
    listen 80;
    server_name joy.aicloser.tech aicloser.tech www.aicloser.tech;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── Joy Bot — joy.aicloser.tech ────────────────────────────

server {
    listen 443 ssl;
    server_name joy.aicloser.tech;

    # SSL — filled in by Certbot
    ssl_certificate     /etc/letsencrypt/live/joy.aicloser.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/joy.aicloser.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    client_max_body_size 5M;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

# ── Closer Tech Website — aicloser.tech ────────────────────

server {
    listen 443 ssl;
    server_name aicloser.tech www.aicloser.tech;

    ssl_certificate     /etc/letsencrypt/live/aicloser.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aicloser.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/closertech;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|ico|woff2?|svg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
